apiVersion: 1
groups:
    - orgId: 1
      name: robot-shop-alerts
      folder: Robot Shop
      interval: 1m
      rules:
        - uid: ag4p18zan7n5se
          title: RobotShopFrontendDown
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                editorMode: code
                expr: probe_success{job="robot-shop-availability"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            description: The Robot Shop availability probe has failed. Prometheus reports probe_success below 1. Check the frontend service, Kubernetes pods, and application availability.
            summary: Robot Shop frontend is DOWN
          labels:
            environment: dev
            service: robot-shop
            severity: critical
          isPaused: false
          notification_settings:
            receiver: Robot-Shop-Slack
