alertmanager:
  enabled: false

pushgateway:
  enabled: false

server:
  persistentVolume:
    enabled: false
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus-node-exporter:
  enabled: false

extraScrapeConfigs: |
  - job_name: "robot-shop-availability"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://web.robot-shop.svc.cluster.local:8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115

  - job_name: "robot-shop-cart"
    metrics_path: /metrics
    static_configs:
      - targets:
          - cart.robot-shop.svc.cluster.local:8080

  - job_name: "robot-shop-payment"
    metrics_path: /metrics
    static_configs:
      - targets:
          - payment.robot-shop.svc.cluster.local:8080
